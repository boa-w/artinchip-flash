name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libusb-1.0-0-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install libusb

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test

      - name: Build release binaries
        run: cargo build --release --bins

      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $system = "windows-$($env:RUNNER_ARCH.ToLower())"
          $archive = "aic-flash-$system.zip"
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          New-Item -ItemType Directory -Force packages, dist | Out-Null

          Copy-Item target/release/aic-flash.exe "dist/aic-flash-$system.exe"
          Copy-Item target/release/aic-flash-gui.exe "dist/aic-flash-gui-$system.exe"
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "packages/$archive" -Force

          dotnet tool install --global wix --version 5.0.2
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          wix extension add -g WixToolset.UI.wixext/5.0.2
          @"
          {\rtf1\ansi\deff0
          {\fonttbl{\f0 Segoe UI;}}
          \f0\fs18
          aic-flash ArtInChip Flasher\par
          \par
          This installer installs the aic-flash command-line tool and graphical flashing application.\par
          \par
          After installation completes, click Finish to close the setup wizard.\par
          }
          "@ | Set-Content -Path license.rtf -Encoding ASCII
          @"
          <Wix xmlns="http://wixtoolset.org/schemas/v4/wxs" xmlns:ui="http://wixtoolset.org/schemas/v4/wxs/ui">
            <Package Name="aic-flash ArtInChip Flasher" Manufacturer="boa-w" Version="$version" UpgradeCode="{6E258C67-9E5F-48FD-BE41-4F53565B76ED}" Scope="perMachine">
              <MajorUpgrade DowngradeErrorMessage="A newer version of aic-flash is already installed." />
              <MediaTemplate EmbedCab="yes" />
              <Property Id="ARPCOMMENTS" Value="Cross-platform CLI and GUI flasher for ArtInChip SoCs." />
              <Property Id="ARPCONTACT" Value="boa-w" />
              <Property Id="ARPURLINFOABOUT" Value="https://github.com/boa-w/aic-flash" />
              <Property Id="ARPNOMODIFY" Value="1" />
              <WixVariable Id="WixUILicenseRtf" Value="license.rtf" />
              <ui:WixUI Id="WixUI_InstallDir" InstallDirectory="INSTALLFOLDER" />

              <StandardDirectory Id="ProgramFilesFolder">
                <Directory Id="INSTALLFOLDER" Name="aic-flash" />
              </StandardDirectory>

              <StandardDirectory Id="ProgramMenuFolder">
                <Directory Id="ApplicationProgramsFolder" Name="aic-flash ArtInChip Flasher" />
              </StandardDirectory>

              <Feature Id="Main" Title="aic-flash" Level="1">
                <ComponentRef Id="CliExe" />
                <ComponentRef Id="GuiExe" />
                <ComponentRef Id="ReadmeFile" />
                <ComponentRef Id="StartMenuShortcut" />
              </Feature>

              <Component Id="CliExe" Directory="INSTALLFOLDER" Guid="*">
                <File Id="CliFile" Source="target\release\aic-flash.exe" Name="aic-flash.exe" KeyPath="yes" />
              </Component>

              <Component Id="GuiExe" Directory="INSTALLFOLDER" Guid="*">
                <File Id="GuiFile" Source="target\release\aic-flash-gui.exe" Name="aic-flash-gui.exe" KeyPath="yes" />
              </Component>

              <Component Id="ReadmeFile" Directory="INSTALLFOLDER" Guid="*">
                <File Id="Readme" Source="README.md" Name="README.md" KeyPath="yes" />
              </Component>

              <Component Id="StartMenuShortcut" Directory="ApplicationProgramsFolder" Guid="*">
                <Shortcut Id="AicFlashGuiShortcut" Name="aic-flash GUI" Target="[INSTALLFOLDER]aic-flash-gui.exe" WorkingDirectory="INSTALLFOLDER" />
                <RemoveFolder Id="RemoveApplicationProgramsFolder" On="uninstall" />
                <RegistryValue Root="HKLM" Key="Software\boa-w\aic-flash" Name="installed" Type="integer" Value="1" KeyPath="yes" />
              </Component>
            </Package>
          </Wix>
          "@ | Set-Content -Path installer.wxs -Encoding UTF8
          wix build installer.wxs -ext WixToolset.UI.wixext -culture zh-CN -o "packages/aic-flash-$system.msi"
          Remove-Item -Path packages/*.wixpdb -ErrorAction SilentlyContinue

      - name: Package Linux artifacts
        if: runner.os == 'Linux'
        run: |
          system="$(printf '%s-%s' "$RUNNER_OS" "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          archive="aic-flash-${system}.tar.gz"
          version="$(awk -F\" '/^version =/ { print $2; exit }' Cargo.toml)"
          case "$RUNNER_ARCH" in
            X64) deb_arch="amd64" ;;
            ARM64) deb_arch="arm64" ;;
            *) deb_arch="$(dpkg --print-architecture)" ;;
          esac
          mkdir -p packages dist
          cp target/release/aic-flash "dist/aic-flash-${system}"
          cp target/release/aic-flash-gui "dist/aic-flash-gui-${system}"
          cp README.md dist/
          tar -czf "packages/$archive" -C dist .

          pkgroot="deb-root"
          mkdir -p "$pkgroot/DEBIAN" "$pkgroot/usr/bin" "$pkgroot/usr/share/applications" "$pkgroot/usr/share/doc/aic-flash" "$pkgroot/usr/lib/udev/rules.d"
          install -m 0755 target/release/aic-flash "$pkgroot/usr/bin/aic-flash"
          install -m 0755 target/release/aic-flash-gui "$pkgroot/usr/bin/aic-flash-gui"
          install -m 0644 README.md "$pkgroot/usr/share/doc/aic-flash/README.md"
          cat > "$pkgroot/usr/share/applications/aic-flash-gui.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=aic-flash GUI
          Comment=ArtInChip firmware flashing tool
          Exec=aic-flash-gui
          Terminal=false
          Categories=Utility;Development;
          EOF
          cat > "$pkgroot/usr/lib/udev/rules.d/99-aic-flash.rules" <<'EOF'
          SUBSYSTEM=="usb", ATTR{idVendor}=="33c3", ATTR{idProduct}=="6677", TAG+="uaccess", MODE="0666"
          EOF
          cat > "$pkgroot/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if command -v udevadm >/dev/null 2>&1; then
            udevadm control --reload-rules || true
            udevadm trigger || true
          fi
          exit 0
          EOF
          cat > "$pkgroot/DEBIAN/postrm" <<'EOF'
          #!/bin/sh
          set -e
          if command -v udevadm >/dev/null 2>&1; then
            udevadm control --reload-rules || true
          fi
          exit 0
          EOF
          chmod 0755 "$pkgroot/DEBIAN/postinst" "$pkgroot/DEBIAN/postrm"
          installed_size="$(du -sk "$pkgroot" | cut -f1)"
          cat > "$pkgroot/DEBIAN/control" <<EOF
          Package: aic-flash
          Version: $version
          Section: utils
          Priority: optional
          Architecture: $deb_arch
          Installed-Size: $installed_size
          Maintainer: boa-w
          Depends: libc6, libusb-1.0-0, libudev1, libx11-6, libxi6, libxcursor1, libxrandr2, libxinerama1, libxkbcommon0, libgl1
          Description: ArtInChip firmware flashing tool
           Cross-platform CLI and GUI flasher for ArtInChip SoCs.
          EOF
          dpkg-deb --build "$pkgroot" "packages/aic-flash-${system}.deb"

      - name: Package macOS artifacts
        if: runner.os == 'macOS'
        run: |
          system="$(printf '%s-%s' "$RUNNER_OS" "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          archive="aic-flash-${system}.tar.gz"
          version="$(awk -F\" '/^version =/ { print $2; exit }' Cargo.toml)"
          mkdir -p packages dist
          cp target/release/aic-flash "dist/aic-flash-${system}"
          cp target/release/aic-flash-gui "dist/aic-flash-gui-${system}"
          cp README.md dist/
          tar -czf "packages/$archive" -C dist .

          pkgroot="pkg-root"
          app="$pkgroot/Applications/aic-flash-gui.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$pkgroot/usr/local/bin"
          install -m 0755 target/release/aic-flash "$pkgroot/usr/local/bin/aic-flash"
          install -m 0755 target/release/aic-flash-gui "$app/Contents/MacOS/aic-flash-gui"
          cat > "$app/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>aic-flash GUI</string>
            <key>CFBundleExecutable</key>
            <string>aic-flash-gui</string>
            <key>CFBundleIdentifier</key>
            <string>com.boaw.aic-flash-gui</string>
            <key>CFBundleName</key>
            <string>aic-flash-gui</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>CFBundleVersion</key>
            <string>0.1.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
          </dict>
          </plist>
          EOF
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $version" "$app/Contents/Info.plist"
          pkgbuild --root "$pkgroot" --identifier "com.boaw.aic-flash" --version "$version" --install-location / "packages/aic-flash-${system}.pkg"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: aic-flash-${{ runner.os }}-${{ runner.arch }}-packages
          path: packages/*
          if-no-files-found: error

  nightly:
    name: publish-nightly
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Move nightly tag to current commit
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'nightly';
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) throw error;
            }
            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha,
            });

      - name: Remove previous nightly assets
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: 'nightly',
              });
              for (const asset of release.data.assets) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id,
                });
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Publish nightly release
        uses: actions/github-script@v7
        env:
          ASSET_DIR: release-assets
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'nightly';
            const body = [
              `Automated nightly build from \`${context.sha}\`.`,
              '',
              'Portable archives and native installers are named as `aic-flash-<system>`.',
            ].join('\n');

            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.data.id,
                name: 'aic-flash nightly',
                body,
                prerelease: true,
                make_latest: 'false',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              release = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: 'aic-flash nightly',
                body,
                prerelease: true,
                make_latest: 'false',
              });
            }

            const assetDir = process.env.ASSET_DIR;
            for (const file of fs.readdirSync(assetDir)) {
              const fullPath = path.join(assetDir, file);
              if (!fs.statSync(fullPath).isFile()) continue;
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.data.id,
                name: file,
                data: fs.readFileSync(fullPath),
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': fs.statSync(fullPath).size,
                },
              });
            }
