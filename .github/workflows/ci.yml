name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libusb-1.0-0-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install libusb

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test

      - name: Build release binaries
        run: cargo build --release --bins

      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $system = "windows-$($env:RUNNER_ARCH.ToLower())"
          $archive = "artinchip-flash-$system.zip"
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          New-Item -ItemType Directory -Force packages, dist | Out-Null

          Copy-Item target/release/artinchip-flash.exe "dist/artinchip-flash-$system.exe"
          Copy-Item target/release/artinchip-flash-gui.exe "dist/artinchip-flash-gui-$system.exe"
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "packages/$archive" -Force

          dotnet tool install --global wix --version 5.0.2
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          @"
          <Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">
            <Package Name="artinchip-flash ArtInChip Flasher" Manufacturer="boa-w" Version="$version" UpgradeCode="{6E258C67-9E5F-48FD-BE41-4F53565B76ED}" Scope="perMachine">
              <MajorUpgrade DowngradeErrorMessage="A newer version of artinchip-flash is already installed." />
              <MediaTemplate EmbedCab="yes" />
              <Property Id="ARPCOMMENTS" Value="Cross-platform CLI and GUI flasher for ArtInChip SoCs." />
              <Property Id="ARPCONTACT" Value="boa-w" />
              <Property Id="ARPURLINFOABOUT" Value="https://github.com/boa-w/artinchip-flash" />
              <Icon Id="ArtInChipFlashIcon" SourceFile="assets\artinchip-flash.ico" />
              <Property Id="ARPPRODUCTICON" Value="ArtInChipFlashIcon" />
              <Property Id="ARPNOMODIFY" Value="1" />

              <StandardDirectory Id="ProgramFilesFolder">
                <Directory Id="INSTALLFOLDER" Name="artinchip-flash" />
              </StandardDirectory>

              <StandardDirectory Id="ProgramMenuFolder">
                <Directory Id="ApplicationProgramsFolder" Name="artinchip-flash ArtInChip Flasher" />
              </StandardDirectory>

              <Feature Id="Main" Title="artinchip-flash" Level="1">
                <ComponentRef Id="CliExe" />
                <ComponentRef Id="GuiExe" />
                <ComponentRef Id="ReadmeFile" />
                <ComponentRef Id="StartMenuShortcut" />
              </Feature>

              <Component Id="CliExe" Directory="INSTALLFOLDER" Guid="*">
                <File Id="CliFile" Source="target\release\artinchip-flash.exe" Name="artinchip-flash.exe" KeyPath="yes" />
              </Component>

              <Component Id="GuiExe" Directory="INSTALLFOLDER" Guid="*">
                <File Id="GuiFile" Source="target\release\artinchip-flash-gui.exe" Name="artinchip-flash-gui.exe" KeyPath="yes" />
              </Component>

              <Component Id="ReadmeFile" Directory="INSTALLFOLDER" Guid="*">
                <File Id="Readme" Source="README.md" Name="README.md" KeyPath="yes" />
              </Component>

              <Component Id="StartMenuShortcut" Directory="ApplicationProgramsFolder" Guid="*">
                <Shortcut Id="ArtInChipFlashGuiShortcut" Name="artinchip-flash GUI" Target="[INSTALLFOLDER]artinchip-flash-gui.exe" WorkingDirectory="INSTALLFOLDER" Icon="ArtInChipFlashIcon" />
                <RemoveFolder Id="RemoveApplicationProgramsFolder" On="uninstall" />
                <RegistryValue Root="HKLM" Key="Software\boa-w\artinchip-flash" Name="installed" Type="integer" Value="1" KeyPath="yes" />
              </Component>
            </Package>
          </Wix>
          "@ | Set-Content -Path installer.wxs -Encoding UTF8
          wix build installer.wxs -o "packages/artinchip-flash-$system.msi"
          Remove-Item -Path packages/*.wixpdb -ErrorAction SilentlyContinue

          choco install innosetup --no-progress -y
          @"
          #define AppName "artinchip-flash ArtInChip Flasher"
          #define AppVersion "$version"

          [Setup]
          AppId={{6E258C67-9E5F-48FD-BE41-4F53565B76ED}
          AppName={#AppName}
          AppVersion={#AppVersion}
          AppPublisher=boa-w
          AppPublisherURL=https://github.com/boa-w/artinchip-flash
          AppSupportURL=https://github.com/boa-w/artinchip-flash
          AppUpdatesURL=https://github.com/boa-w/artinchip-flash/releases/tag/nightly
          DefaultDirName={autopf}\artinchip-flash
          DefaultGroupName=artinchip-flash ArtInChip Flasher
          DisableProgramGroupPage=yes
          OutputDir=packages
          OutputBaseFilename=artinchip-flash-$system-setup
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=admin
          UninstallDisplayName=artinchip-flash ArtInChip Flasher
          SetupIconFile=assets\artinchip-flash.ico
          UninstallDisplayIcon={app}\artinchip-flash-gui.exe

          [Files]
          Source: "target\release\artinchip-flash.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "target\release\artinchip-flash-gui.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "README.md"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\artinchip-flash GUI"; Filename: "{app}\artinchip-flash-gui.exe"; WorkingDir: "{app}"
          Name: "{group}\artinchip-flash CLI"; Filename: "{app}\artinchip-flash.exe"; WorkingDir: "{app}"

          [Run]
          Filename: "{app}\artinchip-flash-gui.exe"; Description: "Launch artinchip-flash GUI"; Flags: nowait postinstall skipifsilent unchecked
          "@ | Set-Content -Path installer.iss -Encoding UTF8
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc installer.iss
          } else {
            iscc installer.iss
          }

      - name: Package Linux artifacts
        if: runner.os == 'Linux'
        run: |
          system="$(printf '%s-%s' "$RUNNER_OS" "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          archive="artinchip-flash-${system}.tar.gz"
          version="$(awk -F\" '/^version =/ { print $2; exit }' Cargo.toml)"
          case "$RUNNER_ARCH" in
            X64) deb_arch="amd64" ;;
            ARM64) deb_arch="arm64" ;;
            *) deb_arch="$(dpkg --print-architecture)" ;;
          esac
          mkdir -p packages dist
          cp target/release/artinchip-flash "dist/artinchip-flash-${system}"
          cp target/release/artinchip-flash-gui "dist/artinchip-flash-gui-${system}"
          cp README.md dist/
          tar -czf "packages/$archive" -C dist .

          pkgroot="deb-root"
          mkdir -p "$pkgroot/DEBIAN" "$pkgroot/usr/bin" "$pkgroot/usr/share/applications" "$pkgroot/usr/share/doc/artinchip-flash" "$pkgroot/usr/share/icons/hicolor/256x256/apps" "$pkgroot/usr/lib/udev/rules.d"
          install -m 0755 target/release/artinchip-flash "$pkgroot/usr/bin/artinchip-flash"
          install -m 0755 target/release/artinchip-flash-gui "$pkgroot/usr/bin/artinchip-flash-gui"
          install -m 0644 README.md "$pkgroot/usr/share/doc/artinchip-flash/README.md"
          install -m 0644 assets/icons/artinchip-flash-256.png "$pkgroot/usr/share/icons/hicolor/256x256/apps/artinchip-flash.png"
          cat > "$pkgroot/usr/share/applications/artinchip-flash-gui.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=artinchip-flash GUI
          Comment=ArtInChip firmware flashing tool
          Exec=artinchip-flash-gui
          Icon=artinchip-flash
          Terminal=false
          Categories=Utility;Development;
          EOF
          cat > "$pkgroot/usr/lib/udev/rules.d/99-artinchip-flash.rules" <<'EOF'
          SUBSYSTEM=="usb", ATTR{idVendor}=="33c3", ATTR{idProduct}=="6677", TAG+="uaccess", MODE="0666"
          EOF
          cat > "$pkgroot/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if command -v udevadm >/dev/null 2>&1; then
            udevadm control --reload-rules || true
            udevadm trigger || true
          fi
          exit 0
          EOF
          cat > "$pkgroot/DEBIAN/postrm" <<'EOF'
          #!/bin/sh
          set -e
          if command -v udevadm >/dev/null 2>&1; then
            udevadm control --reload-rules || true
          fi
          exit 0
          EOF
          chmod 0755 "$pkgroot/DEBIAN/postinst" "$pkgroot/DEBIAN/postrm"
          installed_size="$(du -sk "$pkgroot" | cut -f1)"
          cat > "$pkgroot/DEBIAN/control" <<EOF
          Package: artinchip-flash
          Version: $version
          Section: utils
          Priority: optional
          Architecture: $deb_arch
          Installed-Size: $installed_size
          Maintainer: boa-w
          Depends: libc6, libusb-1.0-0, libudev1, libx11-6, libxi6, libxcursor1, libxrandr2, libxinerama1, libxkbcommon0, libgl1
          Description: ArtInChip firmware flashing tool
           Cross-platform CLI and GUI flasher for ArtInChip SoCs.
          EOF
          dpkg-deb --build "$pkgroot" "packages/artinchip-flash-${system}.deb"

      - name: Package macOS artifacts
        if: runner.os == 'macOS'
        run: |
          system="$(printf '%s-%s' "$RUNNER_OS" "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          archive="artinchip-flash-${system}.tar.gz"
          version="$(awk -F\" '/^version =/ { print $2; exit }' Cargo.toml)"
          mkdir -p packages dist
          cp target/release/artinchip-flash "dist/artinchip-flash-${system}"
          cp target/release/artinchip-flash-gui "dist/artinchip-flash-gui-${system}"
          cp README.md dist/
          tar -czf "packages/$archive" -C dist .

          pkgroot="pkg-root"
          app="$pkgroot/Applications/artinchip-flash-gui.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$pkgroot/usr/local/bin"
          install -m 0755 target/release/artinchip-flash "$pkgroot/usr/local/bin/artinchip-flash"
          install -m 0755 target/release/artinchip-flash-gui "$app/Contents/MacOS/artinchip-flash-gui"
          install -m 0644 assets/artinchip-flash.icns "$app/Contents/Resources/artinchip-flash.icns"
          cat > "$app/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>artinchip-flash GUI</string>
            <key>CFBundleExecutable</key>
            <string>artinchip-flash-gui</string>
            <key>CFBundleIdentifier</key>
            <string>com.boaw.artinchip-flash-gui</string>
            <key>CFBundleName</key>
            <string>artinchip-flash-gui</string>
            <key>CFBundleIconFile</key>
            <string>artinchip-flash.icns</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>CFBundleVersion</key>
            <string>0.1.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
          </dict>
          </plist>
          EOF
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $version" "$app/Contents/Info.plist"
          pkgbuild --root "$pkgroot" --identifier "com.boaw.artinchip-flash" --version "$version" --install-location / "packages/artinchip-flash-${system}.pkg"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: artinchip-flash-${{ runner.os }}-${{ runner.arch }}-packages
          path: packages/*
          if-no-files-found: error

  nightly:
    name: publish-nightly
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Move nightly tag to current commit
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'nightly';
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) throw error;
            }
            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha,
            });

      - name: Remove previous nightly assets
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: 'nightly',
              });
              for (const asset of release.data.assets) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id,
                });
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Publish nightly release
        uses: actions/github-script@v7
        env:
          ASSET_DIR: release-assets
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'nightly';
            const body = [
              `Automated nightly build from \`${context.sha}\`.`,
              '',
              'Portable archives and native installers are named as `artinchip-flash-<system>`.',
            ].join('\n');

            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.data.id,
                name: 'artinchip-flash nightly',
                body,
                prerelease: true,
                make_latest: 'false',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              release = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: 'artinchip-flash nightly',
                body,
                prerelease: true,
                make_latest: 'false',
              });
            }

            const assetDir = process.env.ASSET_DIR;
            for (const file of fs.readdirSync(assetDir)) {
              const fullPath = path.join(assetDir, file);
              if (!fs.statSync(fullPath).isFile()) continue;
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.data.id,
                name: file,
                data: fs.readFileSync(fullPath),
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': fs.statSync(fullPath).size,
                },
              });
            }
